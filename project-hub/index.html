<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Hub — Timeline</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- auth-gate placeholder (disabled) -->
  <div id="auth-gate" hidden></div>

  <div id="app">
    <header class="hub-header">
      <div class="hub-header__inner">
        <div class="hub-header__title-block">
          <span class="hub-header__label">Project Hub</span>
          <h1 class="hub-header__title" id="project-title">Loading…</h1>
          <span class="hub-header__status" id="project-status"></span>
        </div>
        <div class="hub-header__right">
          <span class="realtime-badge" id="realtime-badge" data-status="off">○ Off</span>
          <div class="hub-header__project-picker">
            <label for="project-select" class="sr-only">Select project</label>
            <select id="project-select"></select>
          </div>
        </div>
      </div>
    </header>

    <div class="filter-bar" role="toolbar" aria-label="Timeline filters">
      <div class="filter-bar__group">
        <span class="filter-bar__group-label">Kind</span>
        <button class="filter-btn active" data-filter-kind="milestone" aria-pressed="true"><span class="dot dot--milestone"></span> Milestone</button>
        <button class="filter-btn active" data-filter-kind="update" aria-pressed="true"><span class="dot dot--update"></span> Update</button>
        <button class="filter-btn active" data-filter-kind="decision" aria-pressed="true"><span class="dot dot--decision"></span> Decision</button>
        <button class="filter-btn active" data-filter-kind="launch" aria-pressed="true"><span class="dot dot--launch"></span> Launch</button>
        <button class="filter-btn active" data-filter-kind="blocker" aria-pressed="true"><span class="dot dot--blocker"></span> Blocker</button>
      </div>
    </div>

    <main class="timeline-section">
      <div class="timeline-wrapper" id="timeline-wrapper">
        <div class="timeline-axis" id="timeline-axis"></div>
        <div class="timeline-track" id="timeline-track"></div>
        <div class="timeline-empty" id="timeline-empty" hidden>
          <p>No events match the current filters.</p>
        </div>
      </div>
    </main>

    <aside class="detail-panel" id="detail-panel" aria-live="polite">
      <div class="detail-panel__empty" id="detail-empty">
        <p>Select an event on the timeline to see details.</p>
      </div>
      <div class="detail-panel__card" id="detail-card" hidden>
        <div class="detail-card__nav">
          <button class="nav-btn" id="nav-prev" aria-label="Previous event">← Prev</button>
          <div class="detail-card__nav-dropdown">
            <label for="event-nav-select" class="sr-only">Jump to event</label>
            <select id="event-nav-select"></select>
          </div>
          <button class="nav-btn" id="nav-next" aria-label="Next event">Next →</button>
        </div>
        <div class="detail-card__header">
          <span class="detail-card__kind" id="card-kind"></span>
          <span class="detail-card__source-badge" id="card-source-badge" hidden></span>
          <span class="detail-card__context-badge" id="card-context-badge" hidden></span>
          <time class="detail-card__time" id="card-time"></time>
        </div>
        <h2 class="detail-card__summary" id="card-summary"></h2>
        <div class="detail-card__meta" id="card-meta"></div>
        <div class="detail-card__body" id="card-body"></div>
        <div class="detail-card__actions" id="card-actions"></div>

        <div class="linked-annotations" id="linked-annotations" hidden></div>

        <div class="annotation-drawer" id="annotation-drawer" hidden>
          <div class="annotation-drawer__header">
            <h3>Add event</h3>
            <button class="annotation-drawer__close" id="annotation-cancel" type="button">Cancel</button>
          </div>
          <div class="annotation-drawer__linked" id="annotation-linked"></div>
          <form id="annotation-form" class="annotation-form">
            <label>
              <span>Type</span>
              <select id="annotation-kind">
                <option value="milestone">Milestone</option>
                <option value="update" selected>Update</option>
                <option value="decision">Decision</option>
                <option value="launch">Launch</option>
                <option value="blocker">Blocker</option>
              </select>
            </label>
            <label>
              <span>Context</span>
              <select id="annotation-context">
                <option value="production" selected>production</option>
                <option value="development">development</option>
                <option value="test">test</option>
              </select>
            </label>
            <label>
              <span>Author</span>
              <input id="annotation-author" type="text" placeholder="Your name" maxlength="120" />
            </label>
            <label>
              <span>Title</span>
              <input id="annotation-summary" type="text" placeholder="Short event title" maxlength="240" required />
            </label>
            <label class="annotation-form__full">
              <span>Notes</span>
              <textarea id="annotation-narrative" rows="5" placeholder="What happened?"></textarea>
            </label>
            <div class="annotation-form__actions">
              <button class="nav-btn" type="button" id="annotation-reset">Reset</button>
              <button class="nav-btn nav-btn--primary" type="submit" id="annotation-submit">Save event</button>
            </div>
            <p class="annotation-form__status" id="annotation-status" hidden></p>
          </form>
        </div>

        <div class="annotation-drawer annotation-drawer--edit" id="edit-drawer" hidden>
          <div class="annotation-drawer__header">
            <h3>Edit event</h3>
            <button class="annotation-drawer__close" id="edit-cancel" type="button">Cancel</button>
          </div>
          <form id="edit-form" class="annotation-form">
            <label>
              <span>Type</span>
              <select id="edit-kind">
                <option value="milestone">Milestone</option>
                <option value="update">Update</option>
                <option value="decision">Decision</option>
                <option value="launch">Launch</option>
                <option value="blocker">Blocker</option>
              </select>
            </label>
            <label>
              <span>Context</span>
              <select id="edit-context">
                <option value="production">production</option>
                <option value="development">development</option>
                <option value="test">test</option>
              </select>
            </label>
            <label>
              <span>Author</span>
              <input id="edit-author" type="text" placeholder="Your name" maxlength="120" />
            </label>
            <label>
              <span>Title</span>
              <input id="edit-summary" type="text" placeholder="Short event title" maxlength="240" required />
            </label>
            <label class="annotation-form__full">
              <span>Notes</span>
              <textarea id="edit-narrative" rows="5" placeholder="What happened?"></textarea>
            </label>
            <div class="annotation-form__actions">
              <button class="nav-btn nav-btn--danger" type="button" id="edit-delete">Delete</button>
              <button class="nav-btn nav-btn--primary" type="submit" id="edit-submit">Save changes</button>
            </div>
            <p class="annotation-form__status" id="edit-status" hidden></p>
          </form>
        </div>

        <div class="detail-card__payload" id="card-payload-wrapper" hidden>
          <button class="payload-toggle" id="payload-toggle">Show raw payload ▾</button>
          <pre class="detail-card__payload-pre" id="card-payload" hidden></pre>
        </div>
      </div>
    </aside>

    <dialog class="delete-dialog" id="delete-dialog">
      <div class="delete-dialog__inner">
        <h3>Delete event?</h3>
        <p id="delete-dialog-desc">This cannot be undone.</p>
        <div class="delete-dialog__actions">
          <button class="nav-btn" id="delete-cancel">Cancel</button>
          <button class="nav-btn nav-btn--danger" id="delete-confirm">Delete</button>
        </div>
        <p class="annotation-form__status" id="delete-status" hidden></p>
      </div>
    </dialog>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
